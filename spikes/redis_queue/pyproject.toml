[project]
name = "aiogram-extensions-redis-spike"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "redis==8.1.0",
    "taskiq==0.13.0",
    "taskiq-redis==1.2.4",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["."]
exclude = ["**/.venv"]
