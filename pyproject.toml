[project]
name = "aiogram-extensions"
version = "0.1.0"
description = "Modular extensions and utilities for aiogram 3."
readme = "docs/README.md"
authors = [{ name = "igroman4ik-pc", email = "ni4000009@gmail.com" }]
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["aiogram>=3.29.1,<3.32"]

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
    "ruff>=0.17.4,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Project preferences
    "D1",     # Do not require docstrings for every public definition.
    "EM",     # Avoid extra variables solely for exception messages.
    "FIX",    # Allow TODO and FIXME comments without requiring immediate fixes.
    "TD",     # Do not enforce strict TODO formatting or issue references.
    "CPY",    # Do not require copyright headers in every source file.
    "ANN401", # Allow Any when required by dynamic or generic APIs.

    # Runtime type annotations (temporarily)
    # "TC001", # Keep first-party type-only imports available at runtime.
    # "TC002", # Keep third-party type-only imports available at runtime.
    # "TC003", # Keep standard-library type-only imports available at runtime.

    # Ruff formatter compatibility
    "Q",
    "COM812",
    "COM819",
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
    "D213",
]


[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert statements in tests.
    "PLR2004", # Allow literal values in test assertions.
    "INP001",  # Do not require __init__.py in test directories.
]
"examples/**/*.py" = [
    "INP001", # Examples are standalone scripts, not an importable package.
    "T201",   # Console output is part of the examples.
]
"spikes/redis_queue/*.py" = [
    "INP001", # Isolated spike entrypoints are standalone modules, not a package.
]
"spikes/redis_queue/tests/**/*.py" = [
    "S101",    # Match the main test suite's assertion conventions.
    "PLR2004", # Literal expected results and test timing parameters.
    "INP001",  # Match the main test suite's directory conventions.
]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
